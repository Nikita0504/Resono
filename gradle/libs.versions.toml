[versions]
# ─────────────────────────────────────
# SDK & Build Tools
# ─────────────────────────────────────
compileSdk = "36"
minSdk = "26"
targetSdk = "35"

agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.6"

# ─────────────────────────────────────
# AndroidX Core
# ─────────────────────────────────────
androidx-core = "1.18.0"
appcompat = "1.7.1"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
navigation-compose = "2.9.7"
datastore = "1.2.1"

# ─────────────────────────────────────
# Compose
# ─────────────────────────────────────
compose-bom = "2026.03.00"

# ─────────────────────────────────────
# Coroutines
# ─────────────────────────────────────
coroutines = "1.10.2"

# ─────────────────────────────────────
# Room
# ─────────────────────────────────────
room = "2.8.4"

# ─────────────────────────────────────
# Koin
# ─────────────────────────────────────
koin = "4.2.0"

# ─────────────────────────────────────
# Ktor
# ─────────────────────────────────────
ktor = "3.4.1"

# ─────────────────────────────────────
# Serialization
# ─────────────────────────────────────
kotlinx-serialization = "1.10.0"
kotlinx-datetime = "0.7.1"

# ─────────────────────────────────────
# Coil
# ─────────────────────────────────────
coil = "3.4.0"

# ─────────────────────────────────────
# Media3 (ExoPlayer)
# ─────────────────────────────────────
media3 = "1.6.0"

# ─────────────────────────────────────
# Testing
# ─────────────────────────────────────
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-espresso = "3.7.0"
mockk = "1.14.9"
turbine = "1.2.1"

# ─────────────────────────────────────
# Misc
# ─────────────────────────────────────
material = "1.13.0"


# ─────────────────────────────────────
# LIBRARIES
# ─────────────────────────────────────
[libraries]

# ─────────────────────────────────────
# Gradle Plugins (для build-logic)
# ─────────────────────────────────────
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradle-plugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

# ─────────────────────────────────────
# AndroidX Core
# ─────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# ─────────────────────────────────────
# Lifecycle
# ─────────────────────────────────────
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ─────────────────────────────────────
# Navigation
# ─────────────────────────────────────
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# ─────────────────────────────────────
# Compose BOM & UI
# ─────────────────────────────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# ─────────────────────────────────────
# Coroutines
# ─────────────────────────────────────
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ─────────────────────────────────────
# Room
# ─────────────────────────────────────
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# ─────────────────────────────────────
# Koin
# ─────────────────────────────────────
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }

# ─────────────────────────────────────
# Ktor Client
# ─────────────────────────────────────
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# ─────────────────────────────────────
# Serialization
# ─────────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ─────────────────────────────────────
# DataStore
# ─────────────────────────────────────
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ─────────────────────────────────────
# Coil
# ─────────────────────────────────────
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# ─────────────────────────────────────
# Media3 (ExoPlayer)
# ─────────────────────────────────────
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# ─────────────────────────────────────
# Testing
# ─────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# ─────────────────────────────────────
# Misc
# ─────────────────────────────────────
material = { group = "com.google.android.material", name = "material", version.ref = "material" }


# ─────────────────────────────────────
# BUNDLES
# ─────────────────────────────────────
[bundles]

# Compose Core (UI + Lifecycle + Navigation)
compose-core = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-animation",
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]

# Koin DI
koin-android-full = [
    "koin-core",
    "koin-android",
    "koin-compose",
    "koin-compose-viewmodel",
]

# Ktor Client
ktor-client = [
    "ktor-client-core",
    "ktor-client-android",
    "ktor-client-okhttp",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-client-auth",
    "ktor-serialization-kotlinx-json",
]

# Room Database
room-full = [
    "room-runtime",
    "room-ktx",
]

# Media3 ExoPlayer
media3-player = [
    "media3-exoplayer",
    "media3-ui",
    "media3-session",
    "media3-common",
]

# Unit Tests
unit-test = [
    "junit",
    "mockk",
    "coroutines-test",
    "turbine",
]

# Android Tests
android-test = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-compose-ui-test-junit4",
]


# ─────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
